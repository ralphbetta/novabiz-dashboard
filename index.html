<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2447" />
    <title>NovaBiz Merchant Dashboard</title>
    <script>
      // The theme, before the first paint, so a dark page never flashes light. The same rule as resolveTheme in
      // src/store/preferencesSlice.ts, which takes over once the app starts. Blocked storage means following the phone.
      (function () {
        var saved = null
        try { saved = localStorage.getItem('novabiz.theme') } catch (e) {}
        var systemDark = typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches
        if (saved === 'dark' || (saved !== 'light' && systemDark)) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <!-- Filled only if the data service cannot start. Present and empty from first paint, so a screen
         reader announces the message when it appears (ADR-0012). Outside #root, so React never replaces it. -->
    <style>
      /* Styled here, not in the app CSS: this banner must work even if the app's styles never load. */
      /* Collapsed when empty, never display:none: a live region removed from the accessibility tree and
         restored with its message is often not announced (ADR-0012). */
      #startup-alert:empty { padding: 0; border: 0; }
      #startup-alert {
        font: 500 0.875rem/1.4 system-ui, sans-serif;
        background: #fdf3e1; color: #6b3f02; border-bottom: 1px solid #e9c98f;
        padding: 0.75rem 1rem; text-align: center;
      }
    </style>
    <div id="startup-alert" role="alert"></div>
    <style>
      /* The loading screen, shown before the app's code and styles arrive — so it is styled here, with the app's colour
         values copied from src/styles/index.css. src/app/PageLoading.tsx renders the same markup while the first page's
         code downloads, so the hand-over from this placeholder to React is invisible. */
      .app-loading {
        --bg: #f4f6f9; --mark: #0b2447; --mark-fg: #ffffff; --text: #0f172a; --track: #e1e6ee; --bar: #1f4fd1;
        position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      html.dark .app-loading { --bg: #0a1120; --mark: #13294b; --text: #e7edf6; --track: #243149; --bar: #86a8ff; }
      html.dark .app-loading__mark { box-shadow: inset 0 0 0 1px #243149; } /* the dark mark would otherwise melt into the page */
      /* Held back briefly, so a fast load never flashes it. */
      .app-loading__inner { display: flex; flex-direction: column; align-items: center; gap: 14px; animation: app-loading-in 240ms ease-out 200ms both; }
      .app-loading__mark {
        display: grid; place-items: center; width: 52px; height: 52px; border-radius: 16px;
        background: var(--mark); color: var(--mark-fg); font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
      }
      .app-loading__name { margin: 0; color: var(--text); font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
      .app-loading__track { position: relative; width: 112px; height: 3px; margin-top: 6px; overflow: hidden; border-radius: 999px; background: var(--track); }
      .app-loading__bar { position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: inherit; background: var(--bar); animation: app-loading-slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      .app-loading__label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      @keyframes app-loading-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      @keyframes app-loading-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) {
        .app-loading__inner { animation: none; }
        .app-loading__bar { animation: none; left: 30%; }
      }
    </style>
    <!-- Visible until React renders. Keep this markup in step with src/app/PageLoading.tsx. -->
    <div id="root">
      <div class="app-loading" data-app-loading role="status">
        <div class="app-loading__inner" aria-hidden="true">
          <span class="app-loading__mark">N</span>
          <p class="app-loading__name">NovaBiz</p>
          <span class="app-loading__track"><span class="app-loading__bar"></span></span>
        </div>
        <span class="app-loading__label">Loading NovaBiz…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
